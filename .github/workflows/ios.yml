name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build simulator app
        run: >-
          xcodebuild -project ios/Onde.xcodeproj -scheme Onde
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Boot simulator and launch app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Release-iphonesimulator/Onde.app
          xcrun simctl launch "$DEVICE" com.webfaker.onde
          sleep 10
          xcrun simctl io "$DEVICE" screenshot build/ios-launch.png
      - name: Build unsigned iPhone archive
        run: >-
          xcodebuild -project ios/Onde.xcodeproj -scheme Onde
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/Onde-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package builds
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/simulator/Build/Products/Release-iphonesimulator/Onde.app build/Onde-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent build/Onde-unsigned.xcarchive build/Onde-unsigned-archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Onde-iOS
          path: |
            build/Onde-simulator.zip
            build/Onde-unsigned-archive.zip
            build/ios-launch.png
          retention-days: 14
