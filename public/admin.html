<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onde — Administration</title><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/">◉ Onde</a><span>Administration du site</span><a href="/">Retour au chat</a></header><main><div id="access" role="status">Vérification des accès…</div><div id="office" hidden><div class="heading"><div><p class="eyebrow">BACKOFFICE</p><h1 id="title">Vue d’ensemble</h1><p>Administration, modération et suivi des actions.</p></div><button id="refresh">Actualiser</button></div><nav aria-label="Administration"><button data-tab="overview">Vue d’ensemble</button><button data-tab="users">Utilisateurs</button><button data-tab="servers">Serveurs</button><button data-tab="channels">Salons</button><button data-tab="messages">Messages de serveur</button><button data-tab="audit">Journal</button></nav><form id="search-form"><label>Rechercher<input id="query" maxlength="100" placeholder="Nom, e-mail ou contenu selon l’onglet"></label><button>Rechercher</button></form><p id="error" role="alert"></p><section id="content" aria-live="polite"></section><div id="pagination"><button id="previous">Précédent</button><span id="page-label"></span><button id="next">Suivant</button></div></div></main><dialog id="confirm"><form id="action-form"><h2 id="action-title"></h2><p>Cette action sera enregistrée dans le journal d’administration.</p><div id="action-fields"></div><label>Motif<textarea name="reason" id="reason" minlength="3" maxlength="300" required placeholder="Expliquez la raison de cette action"></textarea></label><p id="action-error" role="alert"></p><div class="actions"><button type="button" id="cancel">Annuler</button><button id="apply">Confirmer</button></div></form></dialog><script type="module" src="/admin.js"></script></body></html>
