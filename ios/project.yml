name: Onde
options:
  bundleIdPrefix: com.webfaker
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Onde:
    type: application
    platform: iOS
    sources: [Onde]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webfaker.onde
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Onde/Info.plist
    scheme:
      gatherCoverageData: false
